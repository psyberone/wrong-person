[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wrong-person"
version = "0.1.0"
description = "You've Got the Wrong Person! A mystery puzzle generator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wrong_person contributors" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wrong_person = ["riddles.json"]

[tool.coverage.run]
branch = true
source = ["wrong_person"]

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true

# Development tools only; the package itself needs nothing but the standard library.
# Pinned to the versions the floors were measured with. Install them with
#     python3 -m pip install --group dev       (pip 25.1 or newer)
[dependency-groups]
dev = ["build==1.5.0", "coverage[toml]==7.15.2", "mutmut==3.6.0", "pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
    "README.md",         # tests/test_readme.py runs the README's example
    "tools/",            # tests/test_tools.py, test_private_words.py and test_planted_faults.py run the scripts
    ".github/",          # tests/test_workflow.py reads the workflow,
    "CONTRIBUTING.md",   # this page,
    "pyproject.toml",    # and this file
    "REVIEW.md",         # tests/test_review.py reads the page
]
